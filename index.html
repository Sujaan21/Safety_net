<!DOCTYPE html>
<html lang="en" class="dark">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SafetyNet — Personal Safety Sentinel & Command Center</title>
  
  <!-- Content Security Policy & Security Headers -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; connect-src 'self' https://generativelanguage.googleapis.com https://nominatim.openstreetmap.org https://overpass-api.de; media-src 'self' blob:; worker-src 'self' blob:;" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="manifest" href="/manifest.json" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {

    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-[#070b14] text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden antialiased transition-colors duration-200">

  <!-- Stealth Camouflage Overlay (Disguise Mode) -->
  <div id="camouflage-screen" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-md text-white flex flex-col justify-center items-center p-4 select-none animate-fade-in">
    <div class="w-full max-w-xs bg-[#1c1c1e] rounded-3xl p-5 shadow-2xl border border-white/15 space-y-4">

        0

        <button class="calc-key p-3.5 rounded-xl bg-[#2c2c2e] hover:bg-[#3a3a3c] text-slate-300">±</button>
        <button class="calc-key p-3.5 rounded-xl bg-[#2c2c2e] hover:bg-[#3a3a3c] text-slate-300">%</button>
        <button class="calc-key p-3.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white">÷</button>

        <button class="calc-key p-3.5 rounded-xl bg-[#2c2c2e] hover:bg-[#3a3a3c]">7</button>
        <button class="calc-key p-3.5 rounded-xl bg-[#2c2c2e] hover:bg-[#3a3a3c]">8</button>
        <button class="calc-key p-3.5 rounded-xl bg-[#2c2c2e] hover:bg-[#3a3a3c]">9</button>
        <button class="calc-key p-3.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white">×</button>

        <button class="calc-key p-3.5 rounded-xl bg-[#2c2c2e] hover:bg-[#3a3a3c]">4</button>
        <button class="calc-key p-3.5 rounded-xl bg-[#2c2c2e] hover:bg-[#3a3a3c]">5</button>
        <button class="calc-key p-3.5 rounded-xl bg-[#2c2c2e] hover:bg-[#3a3a3c]">6</button>

      </div>

        <button data-tab="profile" class="nav-tab-btn px-4 py-2 rounded-xl text-xs font-medium transition flex items-center space-x-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">

      <!-- Action Controls: Camouflage, Language, Theme, Siren & User Profile -->
      <div class="flex items-center space-x-2">
        <!-- Dual Language Toggle (EN / HI) -->
        <button id="header-lang-btn" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 text-xs font-bold border border-slate-300 dark:border-slate-700/60 transition active:scale-95 flex items-center space-x-1.5 shadow-sm" title="Change Language / भाषा बदलें">
          <span id="lang-flag">🇮🇳</span>
          <span id="lang-code">HI</span>
        </button>

        <!-- Dark / Light Theme Toggle -->

          <span id="theme-icon">🌙</span>
        </button>

        <!-- Quick Siren Alarm Toggle -->
        <button id="header-siren-btn" title="Toggle Emergency Siren" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 transition active:scale-95 border border-slate-300 dark:border-slate-700/60 shadow-sm">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          </svg>
        </button>

        <!-- User Profile / Auth Status Badge -->

        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />

  <script type="module" src="/src/main.js"></script>
  <script>
    // Robust Standard Calculator Arithmetic Engine (Zero eval, 100% CSP compliant)
    (function() {
      let prevVal = null;
      let currentVal = '0';
      let pendingOp = null;
      let overwrite = false;

      const display = document.getElementById('calc-display');
      const closeCamo = () => {
        const camo = document.getElementById('camouflage-screen');
        if (camo) {
          camo.classList.add('hidden');
          camo.classList.remove('flex');
        }
      };

      document.getElementById('exit-camo-btn')?.addEventListener('click', closeCamo);
      document.getElementById('exit-camo-btn-bottom')?.addEventListener('click', closeCamo);

      function calculate(a, b, op) {
        const num1 = parseFloat(a);
        const num2 = parseFloat(b);
        if (isNaN(num1) || isNaN(num2)) return '0';
        switch (op) {
          case '+': return String(num1 + num2);
          case '−':
          case '-': return String(num1 - num2);
          case '×':
          case '*': return String(num1 * num2);
          case '÷':
          case '/': return num2 === 0 ? '0' : String(num1 / num2);
          default: return String(num2);
        }
      }

      document.querySelectorAll('.calc-key').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.innerText.trim();

          if (key >= '0' && key <= '9') {
            if (currentVal === '0' || overwrite) {
              currentVal = key;
              overwrite = false;
            } else {
              currentVal += key;
            }
          } else if (key === '.') {
            if (overwrite) {
              currentVal = '0.';
              overwrite = false;
            } else if (!currentVal.includes('.')) {
              currentVal += '.';
            }
          } else if (key === 'C') {
            currentVal = '0';
            prevVal = null;
            pendingOp = null;
            overwrite = false;
          } else if (key === '±') {
            currentVal = String(parseFloat(currentVal) * -1);
          } else if (key === '%') {
            currentVal = String(parseFloat(currentVal) / 100);
          } else if (['+', '−', '×', '÷'].includes(key)) {
            if (pendingOp && !overwrite) {
              currentVal = calculate(prevVal, currentVal, pendingOp);
            }
            prevVal = currentVal;
            pendingOp = key;
            overwrite = true;
          } else if (key === '=') {
            if (pendingOp && prevVal !== null) {
              currentVal = calculate(prevVal, currentVal, pendingOp);
              pendingOp = null;
              prevVal = null;
              overwrite = true;
            }
          }

          if (display) {
            display.innerText = currentVal.length > 10 ? parseFloat(currentVal).toPrecision(6) : currentVal;
          }
        });
      });
    })();
  </script>
</body>

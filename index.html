<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SafetyNet — Personal Safety Sentinel & Command Center</title>
  
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#070b14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#06b6d4',
              600: '#0891b2',
            }
          }
        }
      }
    }
  </script>

  <!-- Leaflet & QRCode High Speed CDNs (Zero node_modules required) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-white dark:bg-[#070b14] text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden antialiased transition-colors duration-200">

  <!-- Screen Strobe Emergency Visual Overlay -->
  <div id="screen-strobe-overlay" class="hidden fixed inset-0 z-50 transition-colors pointer-events-auto cursor-pointer flex items-center justify-center">
    <div class="bg-black/90 px-8 py-4 rounded-3xl text-white font-black text-sm uppercase tracking-widest border border-white/20 shadow-2xl">
      Tap anywhere to stop strobe / स्क्रीन पर कहीं भी टैप करें
    </div>
  </div>

  <!-- Full-Width Top Navigation Bar -->
  <header class="w-full sticky top-0 z-30 bg-white/90 dark:bg-[#0b1324]/85 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800/80 px-4 md:px-8 py-3.5 transition-colors shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <!-- Logo & Sentinel Status -->
      <div class="flex items-center space-x-3 cursor-pointer select-none" id="logo-refresh-trigger">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-red-600 via-rose-600 to-red-500 flex items-center justify-center shadow-lg shadow-red-600/30 border border-red-400/30">
          <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 id="header-app-title" class="text-lg md:text-xl font-black tracking-wide bg-gradient-to-r from-red-600 via-rose-500 to-cyan-500 bg-clip-text text-transparent">
              SafetyNet
            </h1>
            <span class="hidden md:inline-block px-2 py-0.5 rounded-full text-[9px] font-black uppercase tracking-wider bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 border border-cyan-500/20">PRO</span>
          </div>
          <div class="text-[11px] font-medium text-emerald-600 dark:text-emerald-400 flex items-center space-x-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="header-sentinel-badge">Sentinel Live</span>
          </div>
        </div>
      </div>

      <!-- Desktop Nav Tabs (Centrally aligned) -->
      <nav class="hidden md:flex items-center space-x-1.5 p-1.5 bg-slate-100 dark:bg-slate-900/80 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-inner">
        <button data-tab="sos" class="nav-tab-btn px-4 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-2 text-cyan-600 dark:text-cyan-400 bg-cyan-500/10 border border-cyan-500/30">
          <span>🚨</span> <span class="nav-label-text">SOS</span>
        </button>
        <button data-tab="timer" class="nav-tab-btn px-4 py-2 rounded-xl text-xs font-medium transition flex items-center space-x-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
          <span>⏱️</span> <span class="nav-label-text">Timer</span>
        </button>
        <button data-tab="map" class="nav-tab-btn px-4 py-2 rounded-xl text-xs font-medium transition flex items-center space-x-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
          <span>🗺️</span> <span class="nav-label-text">Map</span>
        </button>
        <button data-tab="chat" class="nav-tab-btn px-4 py-2 rounded-xl text-xs font-medium transition flex items-center space-x-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
          <span>🤖</span> <span class="nav-label-text">AI Chat</span>
        </button>
        <button data-tab="profile" class="nav-tab-btn px-4 py-2 rounded-xl text-xs font-medium transition flex items-center space-x-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
          <span>📋</span> <span class="nav-label-text">Medical</span>
        </button>
      </nav>

      <!-- Action Controls: Language, Theme & Siren -->
      <div class="flex items-center space-x-2.5">
        <!-- Dual Language Toggle (EN / HI) -->
        <button id="header-lang-btn" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 text-xs font-bold border border-slate-300 dark:border-slate-700/60 transition active:scale-95 flex items-center space-x-1.5 shadow-sm" title="Change Language / भाषा बदलें">
          <span id="lang-flag">🇮🇳</span>
          <span id="lang-code">HI</span>
        </button>

        <!-- Dark / Light Theme Toggle -->
        <button id="header-theme-btn" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 transition active:scale-95 border border-slate-300 dark:border-slate-700/60 shadow-sm" title="Toggle Light/Dark Theme">
          <span id="theme-icon">🌙</span>
        </button>

        <!-- Quick Siren Alarm Toggle -->
        <button id="header-siren-btn" title="Toggle Emergency Siren" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 transition active:scale-95 border border-slate-300 dark:border-slate-700/60 shadow-sm">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-4 md:px-8 py-6 pb-24 md:pb-8">
    <div id="tab-content" class="w-full">
      <!-- Active component injected here -->
    </div>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-[#0b1324]/90 backdrop-blur-2xl px-3 py-2 flex items-center justify-around border-t border-slate-200 dark:border-slate-800 shadow-2xl">
    <button data-tab="sos" class="nav-tab-btn flex flex-col items-center justify-center py-1 px-3 rounded-xl transition text-cyan-600 dark:text-cyan-400">
      <svg class="nav-icon w-5 h-5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <span class="nav-label-text text-[10px] mt-1 font-bold">SOS</span>
    </button>

    <button data-tab="timer" class="nav-tab-btn flex flex-col items-center justify-center py-1 px-3 rounded-xl transition text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
      <svg class="nav-icon w-5 h-5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span class="nav-label-text text-[10px] mt-1">Timer</span>
    </button>

    <button data-tab="map" class="nav-tab-btn flex flex-col items-center justify-center py-1 px-3 rounded-xl transition text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
      <svg class="nav-icon w-5 h-5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
      </svg>
      <span class="nav-label-text text-[10px] mt-1">Map</span>
    </button>

    <button data-tab="chat" class="nav-tab-btn flex flex-col items-center justify-center py-1 px-3 rounded-xl transition text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
      <svg class="nav-icon w-5 h-5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
      </svg>
      <span class="nav-label-text text-[10px] mt-1">AI Chat</span>
    </button>

    <button data-tab="profile" class="nav-tab-btn flex flex-col items-center justify-center py-1 px-3 rounded-xl transition text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
      <svg class="nav-icon w-5 h-5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2" />
      </svg>
      <span class="nav-label-text text-[10px] mt-1">Medical</span>
    </button>
  </nav>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
